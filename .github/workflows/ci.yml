name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      # --- Install Clojure CLI via official script (robust) ---
      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh
          clojure -Sdescribe

      - name: Install babashka (latest)
        shell: bash
        run: |
          set -e
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install
          sudo ./install
          bb --version

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      # --- Install lint/format tooling ---
      - name: Set up Clojure tooling (clj-kondo)
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          clj-kondo: '2025.10.23'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clojure-lsp
        uses: clojure-lsp/setup-clojure-lsp@v1
        with:
          clojure-lsp-version: 2025.11.28-12.47.43

      - name: Compile Java (jnr-ffi bindings)
        shell: bash
        run: |
          set -e
          # Build one development SNAPSHOT for all runtime consumers.
          # Keep compiled classes for subsequent checks.
          clojure -T:build jar

      - name: Verify JDK 21 distribution and prepare independent consumer
        run: |
          python3 -B -m unittest discover -s dev/script -p 'test_build_identity.py'
          python3 -B -m unittest discover -s dev/script -p 'test_verify_distribution.py'
          python3 dev/script/verify_distribution.py prepare target/paclo-1.5.0-SNAPSHOT.jar target/distribution

      - name: Upload the single JDK 21 distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution-1.5.0-SNAPSHOT-jdk21-${{ github.run_id }}
          path: target/distribution/
          if-no-files-found: error

      - name: Run Java tests (JUnit)
        shell: bash
        run: |
          set -e
          # The preceding JAR build already compiled src-java.
          clojure -T:build javac-test
          clojure -T:build junit

      - name: Development entrypoint smoke
        shell: bash
        run: |
          bash -n dev/script/codex.sh dev/script/setup-lint-tools.sh dev/script/mdlint.sh
          bash dev/script/codex.sh smoke

      - name: Verify release metadata guard
        run: python3 -B -m unittest discover -s dev/script -p 'test_verify_release_metadata.py'

      - name: SpotBugs
        shell: bash
        run: |
          set -e
          # Invoke the same analyzer directly, avoiding the tools.build wrapper JVM.
          clojure -M:spotbugs

      - name: CheckStyle
        shell: bash
        run: |
          set -e
          clojure -M:checkstyle

      - name: JaCoCo (coverage gate)
        shell: bash
        env:
          JACOCO_MIN_LINE: "0.25"
        run: |
          set -e
          clojure -M:jacoco
          clojure -M:jacoco-gate

      # The identical Linux/JDK21 Clojure test suite is already executed in
      # compatibility-matrix and is enforced by the required build aggregate.

      - name: Performance gate (mid-50k decode path)
        shell: bash
        run: |
          set -e
          clojure -M:perf-gate

      - name: dns-ext smoke (dns-topn)
        shell: bash
        run: |
          set -euo pipefail
          # Test the same DNS entrypoint in an isolated process; do not shut down
          # agents inside -main (unit tests invoke it in-process).
          timeout 30s clojure -M:dev:dns-ext -e "(require 'examples.dns-topn)" \
            -e '(try (examples.dns-topn/-main "test/resources/dns-sample.pcap") (finally (shutdown-agents)))'
          # Verify that the existing missing-input exit status is unchanged.
          set +e
          timeout 30s clojure -M:dev:dns-ext -e "(require 'examples.dns-topn)" \
            -e '(try (examples.dns-topn/-main "test/resources/no-such-file.pcap") (finally (shutdown-agents)))'
          exit_status=$?
          set -e
          test "$exit_status" -eq 2

      # --- Format / ns check with clojure-lsp (dry-run) ---
      - name: Lint / Format (clojure-lsp dry-run)
        shell: bash
        run: |
          set -e
          clojure-lsp clean-ns --dry
          clojure-lsp format --dry

      - name: clj-kondo lint
        shell: bash
        run: |
          set -e
          clj-kondo --lint src test dev

      - name: Markdown lint (check only)
        shell: bash
        run: |
          set -e
          dev/script/mdlint.sh

  # Execute the same maintained documentation checks on a dedicated runner
  # so slow JVM-based examples and cljdoc loading do not block build-checks.
  documentation-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh
          clojure -Sdescribe

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        run: clojure -T:build javac

      - name: Validate internal Markdown links
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s dev/script -p 'test_verify_doc_links.py'
          python3 dev/script/verify_doc_links.py

      - name: Validate documentation example parser
        run: python3 -m unittest discover -s dev/script -p 'test_verify_doc_examples.py'

      - name: Execute maintained documentation examples
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/script/verify_doc_examples.py

      - name: cljdoc dry run (namespace load)
        shell: bash
        run: |
          set -e
          clojure -Sdeps '{:deps {cljdoc/cljdoc {:mvn/version "0.0.1315-c9e9a7e"}}}' \
            -M -e "(require 'cljdoc.doc-tree) (println :cljdoc-loaded)"

  # Each of the three offline datasets is measured on a dedicated runner.
  # Nine JVM workers remain serial per dataset to avoid CPU contention.
  performance-measurement:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [udp-64, tcp-512, mixed]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh
          clojure -Sdescribe

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        run: clojure -T:build javac

      - name: Performance measurement smoke
        shell: bash
        run: |
          set -e
          clojure -M:perf --mode offline --profile quick --offline-case ${{ matrix.case }} --output target/perf-quick

      - name: Upload performance measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-shard-${{ matrix.case }}-${{ github.run_id }}
          path: target/perf-quick/results.edn
          if-no-files-found: error


  # Validate that every scenario is present exactly once and restore the
  # original results.edn / results.json artifact layout before completing CI.
  # The merger uses a standalone lightweight Clojure deps.edn; no native setup.
  performance-results:
    needs: [performance-measurement]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh
          clojure -Sdescribe

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Download udp-64 benchmark shard
        uses: actions/download-artifact@v4
        with:
          name: perf-shard-udp-64-${{ github.run_id }}
          path: target/perf-shards/udp-64

      - name: Download tcp-512 benchmark shard
        uses: actions/download-artifact@v4
        with:
          name: perf-shard-tcp-512-${{ github.run_id }}
          path: target/perf-shards/tcp-512

      - name: Download mixed benchmark shard
        uses: actions/download-artifact@v4
        with:
          name: perf-shard-mixed-${{ github.run_id }}
          path: target/perf-shards/mixed

      - name: Validate and merge all 27 performance scenarios
        shell: bash
        working-directory: dev/perf-merge
        run: |
          set -euo pipefail
          # Standalone tools.deps project: no libpcap, native bindings or compilation.
          clojure -M:run --profile quick --output ../../target/perf-quick \
            --merge-inputs ../../target/perf-shards/udp-64/results.edn,../../target/perf-shards/tcp-512/results.edn,../../target/perf-shards/mixed/results.edn

      - name: Upload combined performance measurement
        uses: actions/upload-artifact@v4
        with:
          name: perf-quick-${{ github.run_id }}
          path: target/perf-quick/results.*
          if-no-files-found: error

  # Preserve the existing required "build" check. All mandatory checks
  # (including the isolated documentation, compatibility, performance and lint jobs)
  # must succeed, even if another dependency failed or was skipped.
  build:
    needs: [build-checks, documentation-checks, performance-measurement, performance-results, compatibility-matrix, eastwood-lint, distribution-consumer, jdk25-source, arm64-monitor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build, documentation, compatibility, performance and Eastwood checks
        shell: bash
        env:
          BUILD_CHECKS_RESULT: ${{ needs.build-checks.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-checks.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-measurement.result }}
          PERFORMANCE_RESULTS_RESULT: ${{ needs.performance-results.result }}
          ARM64_RESULT: ${{ needs.arm64-monitor.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility-matrix.result }}
          EASTWOOD_RESULT: ${{ needs.eastwood-lint.result }}
          JDK25_SOURCE_RESULT: ${{ needs.jdk25-source.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution-consumer.result }}
        run: |
          set -euo pipefail
          echo "build-checks=$BUILD_CHECKS_RESULT"
          echo "documentation-checks=$DOCUMENTATION_RESULT"
          echo "performance-measurement=$PERFORMANCE_RESULT"
          echo "performance-results=$PERFORMANCE_RESULTS_RESULT"
          echo "compatibility-matrix=$COMPATIBILITY_RESULT"
          echo "eastwood-lint=$EASTWOOD_RESULT"
          test "$BUILD_CHECKS_RESULT" = success
          test "$DOCUMENTATION_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
          test "$PERFORMANCE_RESULTS_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          echo "arm64-monitor=$ARM64_RESULT"
          test "$ARM64_RESULT" = success
          test "$EASTWOOD_RESULT" = success
          echo "distribution-consumer=$DISTRIBUTION_RESULT"
          test "$DISTRIBUTION_RESULT" = success
          echo "jdk25-source=$JDK25_SOURCE_RESULT"
          test "$JDK25_SOURCE_RESULT" = success

  # No checkout and no Java compilation: all runtimes download the same JAR.
  distribution-consumer:
    needs: [build-checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21', '25']
    steps:
      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: '1.11.1.1435'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Cache consumer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: distribution-deps-${{ runner.os }}-${{ matrix.java-version }}-v1

      - name: Download the single JDK 21 distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution-1.5.0-SNAPSHOT-jdk21-${{ github.run_id }}
          path: ${{ runner.temp }}/distribution

      - name: Verify SHA-256 and run isolated consumer
        working-directory: ${{ runner.temp }}/distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_distribution.py consume . --report consumer-jdk${{ matrix.java-version }}.json 2>&1 | tee consumer.log

      - name: Diagnose native access and Unsafe on JDK 25
        if: matrix.java-version == '25'
        working-directory: ${{ runner.temp }}/distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_distribution.py consume . --report consumer-jdk25-native-access.json \
            --java-option=--enable-native-access=ALL-UNNAMED \
            --java-option=--sun-misc-unsafe-memory-access=debug 2>&1 | tee native-access-debug.log

      # Diagnostic denial is not an acceptance requirement. Unexpected failures
      # still fail this step; retain both the original exit status and full log.
      - name: Measure Unsafe denial separately on JDK 25
        if: matrix.java-version == '25'
        working-directory: ${{ runner.temp }}/distribution
        shell: bash
        run: |
          set -uo pipefail
          python3 verify_distribution.py consume . --report consumer-jdk25-unsafe-deny.json \
            --java-option=--enable-native-access=ALL-UNNAMED \
            --java-option=--sun-misc-unsafe-memory-access=deny > unsafe-deny.log 2>&1
          status=$?
          cat unsafe-deny.log
          echo "unsafe-deny exit=$status" | tee unsafe-deny-status.log
          if [ "$status" -ne 0 ]; then
            test "$status" -eq 1 || exit "$status"
            grep -q 'UnsupportedOperationException: putLong' unsafe-deny.log || exit 1
            grep -q 'com.kenai.jffi.UnsafeMemoryIO' unsafe-deny.log || exit 1
          fi

      - name: Upload consumer identity and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-consumer-jdk${{ matrix.java-version }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/distribution/consumer-*.json
            ${{ runner.temp }}/distribution/*.log
          if-no-files-found: error

  # Compatibility experiment, not a declaration of all-platform JDK25 support.
  # Direct commands preserve doctor/smoke's supported JDK17/21 guard.
  jdk25-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: '1.11.1.1435'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Verify Linux x64 and record native package identity
        run: |
          test "${{ runner.os }}" = Linux
          test "${{ runner.arch }}" = X64
          uname -a
          lscpu
          dpkg-query -W libpcap0.8t64 libpcap-dev

      - name: Compile release 17 bindings and run JUnit, Clojure and native checks
        run: |
          python3 -B -m unittest discover -s dev/script -p 'test_verify_jdk25.py'
          python3 dev/script/verify_jdk25.py target/jdk25-source

      - name: Upload source experiment logs and runtime identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdk25-source-${{ github.run_id }}
          path: target/jdk25-source/
          if-no-files-found: error

  compatibility-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-jdk21
            os: ubuntu-latest
            java-version: '21'
            expected-os: Linux
            expected-arch: X64
          - name: macos-arm64-jdk17
            os: macos-latest
            java-version: '17'
            expected-os: macOS
            expected-arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify compatibility environment
        shell: bash
        env:
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
          EXPECTED_RUNNER_OS: ${{ matrix.expected-os }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected-arch }}
        run: |
          set -euo pipefail
          echo "runner.os=${ACTUAL_RUNNER_OS}"
          echo "runner.arch=${ACTUAL_RUNNER_ARCH}"
          echo "uname=$(uname -sm)"
          test "${ACTUAL_RUNNER_OS}" = "${EXPECTED_RUNNER_OS}"
          test "${ACTUAL_RUNNER_ARCH}" = "${EXPECTED_RUNNER_ARCH}"

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libpcap-dev tshark tcpdump
          dpkg-query -W libpcap0.8t64 libpcap-dev tshark wireshark-common tcpdump

      # Homebrew's cask downloads the signed upstream Wireshark distribution.
      # No ChmodBPF/capture permissions are installed for this offline gate.
      - name: Install official Wireshark CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask wireshark
          echo "/Applications/Wireshark.app/Contents/MacOS" >> "$GITHUB_PATH"
          echo "/usr/sbin" >> "$GITHUB_PATH"
          brew info --cask wireshark

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.java-version }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.java-version }}-
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        shell: bash
        run: |
          set -e
          clojure -T:build jar

      - name: Verify native ABI and record loaded library identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = Darwin ]; then sysctl -n machdep.cpu.brand_string; else lscpu; fi
          bash dev/script/codex.sh java-test
          clojure -M:dev:dns-ext -e "(require 'distribution-consumer.consumer)" \
            -e '(try (distribution-consumer.consumer/native-check! "test/resources/dns-sample.pcap") (finally (shutdown-agents)))'

      - name: Run unit tests
        shell: bash
        run: |
          set -e
          clojure -M:test

      - name: External PCAP and PCAPNG interoperability (offline)
        run: python3 dev/script/verify_interop.py target/interop

      - name: Upload external interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p16-interop-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: target/interop/
          if-no-files-found: error

      - name: dns-ext smoke (dns-topn)
        shell: bash
        run: |
          set -e
          clojure -M:dev:dns-ext -m examples.dns-topn test/resources/dns-sample.pcap

  arm64-monitor:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify arm64 environment
        shell: bash
        env:
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          echo "runner.arch=${ACTUAL_RUNNER_ARCH}"
          echo "uname=$(uname -sm)"
          test "${ACTUAL_RUNNER_ARCH}" = "ARM64"

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libpcap
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libpcap-dev tshark tcpdump
          dpkg-query -W libpcap0.8t64 libpcap-dev tshark wireshark-common tcpdump

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        shell: bash
        run: |
          set -e
          clojure -T:build jar

      - name: Verify native ABI and record loaded library identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = Darwin ]; then sysctl -n machdep.cpu.brand_string; else lscpu; fi
          bash dev/script/codex.sh java-test
          clojure -M:dev:dns-ext -e "(require 'distribution-consumer.consumer)" \
            -e '(try (distribution-consumer.consumer/native-check! "test/resources/dns-sample.pcap") (finally (shutdown-agents)))'

      - name: Run unit tests
        shell: bash
        run: |
          set -e
          clojure -M:test

      - name: External PCAP and PCAPNG interoperability (offline)
        run: python3 dev/script/verify_interop.py target/interop

      - name: Upload external interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p16-interop-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: target/interop/
          if-no-files-found: error

      - name: dns-ext smoke (dns-topn)
        shell: bash
        run: |
          set -e
          clojure -M:dev:dns-ext -m examples.dns-topn test/resources/dns-sample.pcap

  eastwood-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        run: clojure -T:build javac

      - name: Verify Eastwood failure exit status
        run: python3 dev/script/test_eastwood_runner.py

      - name: Eastwood lint
        shell: bash
        run: |
          set -e
          clojure -M:eastwood

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17 (stable for cloverage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        shell: bash
        run: |
          set -e
          clojure -T:build jar

      - name: Run cloverage
        continue-on-error: true
        shell: bash
        run: |
          set -e
          clojure -M:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage

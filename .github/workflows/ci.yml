name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      # --- Install Clojure CLI via official script (robust) ---
      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh
          clojure -Sdescribe

      - name: Install babashka (latest)
        shell: bash
        run: |
          set -e
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install
          sudo ./install
          bb --version

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      # --- Install lint/format tooling ---
      - name: Set up Clojure tooling (clj-kondo)
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          clj-kondo: '2025.10.23'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clojure-lsp
        uses: clojure-lsp/setup-clojure-lsp@v1
        with:
          clojure-lsp-version: 2025.11.28-12.47.43

      - name: Compile Java (jnr-ffi bindings)
        shell: bash
        run: |
          set -e
          # Keep JAR/package validation and compiled classes for subsequent checks.
          clojure -T:build jar

      - name: Run Java tests (JUnit)
        shell: bash
        run: |
          set -e
          # The preceding JAR build already compiled src-java.
          clojure -T:build javac-test
          clojure -T:build junit

      - name: Development entrypoint smoke
        shell: bash
        run: |
          bash -n dev/script/codex.sh dev/script/setup-lint-tools.sh dev/script/mdlint.sh
          bash dev/script/codex.sh smoke

      - name: SpotBugs
        shell: bash
        run: |
          set -e
          # Invoke the same analyzer directly, avoiding the tools.build wrapper JVM.
          clojure -M:spotbugs

      - name: CheckStyle
        shell: bash
        run: |
          set -e
          clojure -M:checkstyle

      - name: JaCoCo (coverage gate)
        shell: bash
        env:
          JACOCO_MIN_LINE: "0.25"
        run: |
          set -e
          clojure -M:jacoco
          clojure -M:jacoco-gate

      # The identical Linux/JDK21 Clojure test suite is already executed in
      # compatibility-matrix and is enforced by the required build aggregate.

      - name: Performance gate (mid-50k decode path)
        shell: bash
        run: |
          set -e
          clojure -M:perf-gate

      - name: dns-ext smoke (dns-topn)
        shell: bash
        run: |
          set -euo pipefail
          # Test the same DNS entrypoint in an isolated process; do not shut down
          # agents inside -main (unit tests invoke it in-process).
          timeout 30s clojure -M:dev:dns-ext -e "(require 'examples.dns-topn)" \
            -e '(try (examples.dns-topn/-main "test/resources/dns-sample.pcap") (finally (shutdown-agents)))'
          # Verify that the existing missing-input exit status is unchanged.
          set +e
          timeout 30s clojure -M:dev:dns-ext -e "(require 'examples.dns-topn)" \
            -e '(try (examples.dns-topn/-main "test/resources/no-such-file.pcap") (finally (shutdown-agents)))'
          exit_status=$?
          set -e
          test "$exit_status" -eq 2

      # --- Format / ns check with clojure-lsp (dry-run) ---
      - name: Lint / Format (clojure-lsp dry-run)
        shell: bash
        run: |
          set -e
          clojure-lsp clean-ns --dry
          clojure-lsp format --dry

      - name: clj-kondo lint
        shell: bash
        run: |
          set -e
          clj-kondo --lint src test dev

      - name: Markdown lint (check only)
        shell: bash
        run: |
          set -e
          dev/script/mdlint.sh

  # Execute the same maintained documentation checks on a dedicated runner
  # so slow JVM-based examples and cljdoc loading do not block build-checks.
  documentation-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh
          clojure -Sdescribe

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        run: clojure -T:build javac

      - name: Execute maintained documentation examples (P01)
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/script/verify_doc_examples.py

      - name: cljdoc dry run (namespace load)
        shell: bash
        run: |
          set -e
          clojure -Sdeps '{:deps {cljdoc/cljdoc {:mvn/version "0.0.1315-c9e9a7e"}}}' \
            -M -e "(require 'cljdoc.doc-tree) (println :cljdoc-loaded)"

  # Benchmark remains fully isolated: 27 worker JVMs run serially on
  # their own runner, preserving scenario order, JVM isolation, and inputs.
  performance-measurement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh
          clojure -Sdescribe

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        run: clojure -T:build javac

      - name: Performance measurement smoke
        shell: bash
        run: |
          set -e
          clojure -M:perf --mode offline --profile quick --output target/perf-quick

      - name: Upload performance measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-quick-${{ github.run_id }}
          path: target/perf-quick/results.*
          if-no-files-found: warn

  # Preserve the existing required "build" check. All mandatory checks
  # (including the isolated documentation, compatibility and performance jobs)
  # must succeed, even if another dependency failed or was skipped.
  build:
    needs: [build-checks, documentation-checks, performance-measurement, compatibility-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build, documentation, compatibility and performance checks
        shell: bash
        env:
          BUILD_CHECKS_RESULT: ${{ needs.build-checks.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-checks.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-measurement.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility-matrix.result }}
        run: |
          set -euo pipefail
          echo "build-checks=$BUILD_CHECKS_RESULT"
          echo "documentation-checks=$DOCUMENTATION_RESULT"
          echo "performance-measurement=$PERFORMANCE_RESULT"
          echo "compatibility-matrix=$COMPATIBILITY_RESULT"
          test "$BUILD_CHECKS_RESULT" = success
          test "$DOCUMENTATION_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success

  compatibility-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-jdk21
            os: ubuntu-latest
            java-version: '21'
            expected-os: Linux
            expected-arch: X64
          - name: macos-arm64-jdk17
            os: macos-latest
            java-version: '17'
            expected-os: macOS
            expected-arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify compatibility environment
        shell: bash
        env:
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
          EXPECTED_RUNNER_OS: ${{ matrix.expected-os }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected-arch }}
        run: |
          set -euo pipefail
          echo "runner.os=${ACTUAL_RUNNER_OS}"
          echo "runner.arch=${ACTUAL_RUNNER_ARCH}"
          echo "uname=$(uname -sm)"
          test "${ACTUAL_RUNNER_OS}" = "${EXPECTED_RUNNER_OS}"
          test "${ACTUAL_RUNNER_ARCH}" = "${EXPECTED_RUNNER_ARCH}"

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.java-version }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.java-version }}-
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        shell: bash
        run: |
          set -e
          clojure -T:build jar || \
          (mkdir -p target/classes && javac -cp "$(clojure -Spath)" -d target/classes $(find src-java -name "*.java"))

      - name: Run unit tests
        shell: bash
        run: |
          set -e
          clojure -M:test

      - name: dns-ext smoke (dns-topn)
        shell: bash
        run: |
          set -e
          clojure -M:dev:dns-ext -m examples.dns-topn test/resources/dns-sample.pcap

  arm64-monitor:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify arm64 environment
        shell: bash
        env:
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          echo "runner.arch=${ACTUAL_RUNNER_ARCH}"
          echo "uname=$(uname -sm)"
          test "${ACTUAL_RUNNER_ARCH}" = "ARM64"

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install libpcap
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        shell: bash
        run: |
          set -e
          clojure -T:build jar || \
          (mkdir -p target/classes && javac -cp "$(clojure -Spath)" -d target/classes $(find src-java -name "*.java"))

      - name: Run unit tests
        shell: bash
        run: |
          set -e
          clojure -M:test

      - name: dns-ext smoke (dns-topn)
        shell: bash
        run: |
          set -e
          clojure -M:dev:dns-ext -m examples.dns-topn test/resources/dns-sample.pcap

  eastwood-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Eastwood lint
        shell: bash
        run: |
          set -e
          clojure -M:eastwood

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17 (stable for cloverage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.11.1.1435.sh
          chmod +x clj.sh
          sudo ./clj.sh

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.clojure
          key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            cljdeps-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile Java (jnr-ffi bindings)
        shell: bash
        run: |
          set -e
          clojure -T:build jar || \
          (mkdir -p target/classes && javac -cp "$(clojure -Spath)" -d target/classes $(find src-java -name "*.java"))

      - name: Run cloverage
        continue-on-error: true
        shell: bash
        run: |
          set -e
          clojure -M:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage

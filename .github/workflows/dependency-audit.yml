name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday 03:00 UTC

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvd-scan:
    runs-on: ubuntu-latest
    # Measured cold NVD import exceeded 45 minutes at 61% of 410k records.
    timeout-minutes: 135

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -e
          curl -sSL -o clj.sh https://download.clojure.org/install/linux-install-1.12.5.1664.sh
          chmod +x clj.sh
          sudo ./clj.sh

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          # Preserve the original path list: it is part of cache's format ID.
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-tools-${{ runner.os }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            nvd-tools-${{ runner.os }}-
            nvd-${{ runner.os }}-

      # A new snapshot key on each run; restore the latest compatible database.
      # File mtimes/cache hits are not evidence of NVD freshness: verify report metadata.
      - name: Cache Dependency-Check 12.2.0 data
        uses: actions/cache@v4
        with:
          path: ~/.cache/paclo/dependency-check/12.2.0
          key: nvd-data-12.2.0-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nvd-data-12.2.0-${{ runner.os }}-

      # Both published engines use directory schema 11.0 / data.version 5.5.
      # Preserve the old immutable cache; update only the copied database.
      - name: Seed a missing database from the compatible legacy cache
        shell: bash
        run: |
          set -euo pipefail
          legacy="$HOME/.m2/repository/org/owasp/dependency-check-utils/12.1.6/data/11.0/odc.mv.db"
          current="$HOME/.cache/paclo/dependency-check/12.2.0"
          if [ ! -f "$current/odc.mv.db" ] && [ -f "$legacy" ]; then
            mkdir -p "$current"
            cp -p "$legacy" "$current/odc.mv.db"
            echo "Seeded from engine 12.1.6 schema 11.0; forced NVD refresh is still required."
          else
            echo "Use current database cache, or a full cold import if none exists."
          fi

      - name: Test audit failure and report validation
        run: python3 -B -m unittest discover -s dev/script -p 'test_dependency_audit.py'

      - name: Run nvd-clojure (CVE scan)
        shell: bash
        env:
          NVD_API_TOKEN: ${{ secrets.NVD_API_TOKEN }}
        run: |
          python3 dev/script/dependency_audit.py target/nvd/production --refresh \
            --data-directory "$HOME/.cache/paclo/dependency-check/12.2.0"

      - name: Upload NVD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvd-reports
          path: target/nvd/production/
          if-no-files-found: error
